# nginx do Visualizador BIM (10.3): serve o app (dist/) e repassa /api ao backend.
# Imagem nginx-unprivileged: escuta na 8080, sem root.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Excel e JSON grandes (lote de até 5.000 marcas)
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: o backend manda os próprios cabeçalhos de segurança
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        # Tempo real (SSE /api/obras/{id}/events): sem buffer, conexão longa
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Arquivos com hash no nome: cache longo
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: qualquer rota do app devolve o index.html (sem cache, para pegar versão nova)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
